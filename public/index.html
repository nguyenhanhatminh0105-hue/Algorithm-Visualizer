<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Algorithm Arena</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0f16'/%3E%3Crect x='7' y='17' width='4' height='9' rx='1' fill='%235b7fff'/%3E%3Crect x='14' y='11' width='4' height='15' rx='1' fill='%237c5cff'/%3E%3Crect x='21' y='6' width='4' height='20' rx='1' fill='%23e6e8ef'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <h1>Algorithm Arena</h1>
  <p>Pick a category, tune the difficulty, add contenders, and watch them race.</p>
</header>
<main>
  <section class="controls">
    <div class="control-group">
      <label for="category-select">Category</label>
      <select id="category-select"></select>
      <p id="category-description" class="hint"></p>
    </div>
    <div class="control-group">
      <label id="difficulty-label" for="difficulty-range">Difficulty</label>
      <input type="range" id="difficulty-range" />
      <span id="difficulty-value"></span>
    </div>
    <div class="control-group">
      <label for="algorithm-select">Algorithm</label>
      <select id="algorithm-select"></select>
      <button id="add-contender" type="button">Add contender</button>
    </div>
    <div class="control-group">
      <label>Contenders</label>
      <ul id="contender-list"></ul>
    </div>
    <div class="control-group buttons">
      <button id="run-btn" type="button">Run</button>
      <button id="pause-btn" type="button">Pause</button>
      <button id="reset-btn" type="button">Reset</button>
      <button id="mute-btn" type="button">Mute</button>
    </div>
    <p id="status" class="status"></p>
  </section>
  <section id="arena" class="arena"></section>
</main>
<script type="module" src="js/main.js"></script>
</body>
</html>
